[project]
name = "detection-as-code-lab"
version = "0.1.0"
description = "Run Sigma rules over labeled logs and score them like a detection team is measured."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
detection-lab = "detection_lab.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["detection_lab"]

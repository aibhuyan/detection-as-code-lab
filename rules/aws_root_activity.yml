title: AWS root account activity
id: aws_root_activity
status: experimental
description: >
  Any API activity performed by the AWS account root user. Root should be
  broken-glass only; routine root usage is a strong signal of misuse or a
  compromised bootstrap credential.
references:
  - https://attack.mitre.org/techniques/T1078/004/
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    userIdentity.type: Root
  filter_service_events:
    userIdentity.invokedBy: 'AWS Internal'
  condition: selection and not filter_service_events
falsepositives:
  - Genuine break-glass procedures (should be rare and pre-announced)
level: high
tags:
  - attack.privilege_escalation
  - attack.t1078.004
